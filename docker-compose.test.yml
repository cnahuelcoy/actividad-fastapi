name: icinf1108-test

services:
  db-test:
    image: postgres:17-alpine
    container_name: icinf1108-fastapi-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icinf1108_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icinf1108_test"]
      interval: 2s
      timeout: 5s
      retries: 15
