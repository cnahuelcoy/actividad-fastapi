[project]
name = "estudiantes-fastapi"
version = "0.1.0"
description = "CRUD de estudiantes y sus mascotas con FastAPI, PostgreSQL y sesiones"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "unit: pruebas unitarias sin base de datos ni HTTP",
    "e2e: pruebas HTTP de extremo a extremo con base de datos de test",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.uv]
package = false
